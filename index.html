  <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />

  <meta
    name="keywords"
    content="..."
  />
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <style>
    html, body { margin: 0px; height: 100%; }
    #ruffle-container {
      width: 80%; /* Adjust percentage as needed */
      height: 80%; /* Adjust percentage as needed */
      min-width: 828px; /* Optional: Minimum width to avoid it getting too narrow */
      min-height: 568px; /* Optional: Minimum height */
      margin: 0 auto; /* Center the container */
    }
  </style>
</head>
<body bgcolor="#FFFFFF">
  <div id="ruffle-container"></div>
  <script>
    window.addEventListener("load", (event) => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      const container = document.getElementById("ruffle-container");
      container.appendChild(player);
      player.load("index.swf");
      player.style.width = "100%";
      player.style.height = "100%";
    });
  </script>
</body>
</html>
